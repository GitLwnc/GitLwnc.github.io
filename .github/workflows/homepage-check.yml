name: Homepage check (no deployment)
on:
  push:
    branches: [phase-1-foundation-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/phase-1-foundation-v2'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: JavaScript syntax
        run: |
          node --check assets/js/home-carousel.js
          node --check scripts/check-homepage.cjs
          ruby -c scripts/webrick_video_ranges.rb
          bundle exec ruby -e 'require "bundler"; Bundler.require(:jekyll_plugins); abort "Video range fix was not loaded" unless WEBrick::HTTPServlet::DefaultFileHandler.ancestors.include?(AcademicSiteVideoRanges)'
      - name: Build Jekyll
        run: bundle exec jekyll build --trace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/homepage-qa" playwright@1.56.1
          "$RUNNER_TEMP/homepage-qa/node_modules/.bin/playwright" install --with-deps chrome
      - name: Check homepage
        env:
          NODE_PATH: ${{ runner.temp }}/homepage-qa/node_modules
        run: |
          bundle exec jekyll serve --no-watch --host 127.0.0.1 --port 4000 > /tmp/homepage-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4000/ > /dev/null && break; sleep 1; done
          node scripts/check-homepage.cjs
      - name: Local preview server diagnostics
        if: always()
        run: tail -80 /tmp/homepage-server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-check
          path: qa-output/

name: Homepage check (no deployment)
on:
  push:
    branches: [phase-1-foundation-v3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    if: github.ref == 'refs/heads/phase-1-foundation-v3'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: JavaScript syntax
        run: |
          node --check assets/js/home-carousel.js
          node --check scripts/check-homepage.cjs
          ruby -c scripts/webrick_video_ranges.rb
          ruby -c scripts/check-publications.rb
          ruby scripts/check-publications.rb > /tmp/publication-metadata.json
          bundle exec ruby -e 'require "bundler"; Bundler.require(:jekyll_plugins); abort "Video range fix was not loaded" unless WEBrick::HTTPServlet::DefaultFileHandler.ancestors.include?(AcademicSiteVideoRanges)'
      - name: Generate and commit final-frame video posters
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          extract_last_frame() {
            input="$1"
            output="$2"
            # ffmpeg 4.4 on ubuntu-22.04 has -vsync, not -fps_mode.
            # Decode the final second, replacing the JPEG at each frame.
            # The final output is the *last decoded video frame*, not the midpoint.
            ffmpeg -hide_banner -loglevel error -y -sseof -1 -i "$input" -vsync 0 -q:v 2 -update 1 "$output"
            test -s "$output"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$output"
          }
          extract_last_frame images/research/nucleation-percolation-v4.mp4 images/research/pre-poster-v4.jpg
          extract_last_frame images/research/fracture-toughness-v4.mp4 images/research/fracture-poster-v4.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/research/pre-poster-v4.jpg images/research/fracture-poster-v4.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update research video posters to final frames"
            git push origin HEAD:phase-1-foundation-v3
          fi
      - name: Build Jekyll
        run: bundle exec jekyll build --trace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/homepage-qa" playwright@1.56.1
          "$RUNNER_TEMP/homepage-qa/node_modules/.bin/playwright" install --with-deps chrome
      - name: Check homepage
        env:
          NODE_PATH: ${{ runner.temp }}/homepage-qa/node_modules
        run: |
          bundle exec jekyll serve --no-watch --host 127.0.0.1 --port 4000 > /tmp/homepage-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4000/ > /dev/null && break; sleep 1; done
          node scripts/check-homepage.cjs
      - name: Local preview server diagnostics
        if: always()
        run: tail -80 /tmp/homepage-server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-check
          path: qa-output/

name: Homepage check (no deployment)
on:
  push:
    branches: [phase-1-foundation-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/phase-1-foundation-v2'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Prepare missing poster previews
        if: hashFiles('images/research/pre-poster.jpg') == ''
        run: |
          python3 - <<'PY'
          import subprocess, base64, os
          os.makedirs('qa-output', exist_ok=True)
          for name, source in [('pre', 'images/网站视屏-nucleation percolation transition.mp4'), ('fracture', 'images/网站视屏-Fracture toughness.mp4')]:
              dest = 'qa-output/' + name + '-poster.jpg'
              subprocess.run(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-ss', '20', '-i', source, '-frames:v', '1', '-vf', 'scale=1440:-2', '-q:v', '3', dest], check=True)
              print('POSTER_' + name + '=' + base64.b64encode(open(dest, 'rb').read()).decode())
          PY
      - name: Build Jekyll
        run: bundle exec jekyll build --trace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/homepage-qa" playwright@1.56.1
          "$RUNNER_TEMP/homepage-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check homepage
        env:
          NODE_PATH: ${{ runner.temp }}/homepage-qa/node_modules
        run: |
          python3 -m http.server 4000 --directory _site --bind 127.0.0.1 > /tmp/homepage-server.log 2>&1 &
          node scripts/check-homepage.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-check
          path: qa-output/

{% include base_path %}

<header class="masthead masthead-v2">
  <div class="site-shell masthead-v2__inner">
    <a class="site-identity" href="{{ base_path }}/" aria-label="Yuhan Yang home">
      <span class="site-identity__dot" aria-hidden="true"></span>
      <span class="site-identity__name">{{ site.name | default: site.title }}</span>
      <span class="site-identity__role">Ph.D. Candidate · Hunan University</span>
    </a>

    <input class="site-nav-v2__toggle" type="checkbox" id="site-nav-toggle" aria-hidden="true">
    <label class="site-nav-v2__button" for="site-nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </label>

    <nav class="site-nav-v2" aria-label="Primary navigation">
      <a href="{{ base_path }}/research/">Research</a>
      <a href="{{ base_path }}/publications/">Publications</a>
      <a href="{{ base_path }}/cv/">CV</a>
      <a href="{{ base_path }}/#contact">Contact</a>
    </nav>
  </div>
</header>
